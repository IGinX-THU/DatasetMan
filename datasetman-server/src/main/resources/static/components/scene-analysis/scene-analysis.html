<div class="parsing-rules scene-analysis">
    <!-- 分类统计 chips（按数据类型） -->
    <div class="sa-chips" id="saTypeChips">
        <span class="sa-chip active" data-type="">全部</span>
        <span class="sa-chip-loading">加载中...</span>
    </div>
    <div class="sa-summary" id="saSummary"></div>

    <!-- 数据集列表查询 -->
    <div class="parsing-table-card">
        <div class="sa-toolbar">
            <input type="text" id="saSearchName" class="sa-search" placeholder="按数据集名称搜索" />
            <select id="saTypeFilter" class="sa-select">
                <option value="">全部数据类型</option>
            </select>
            <button class="filter-btn outline" type="button" id="saRefresh">刷新</button>
        </div>
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>数据集名称</th>
                        <th>数据类型</th>
                        <th>版本号</th>
                        <th>样本量</th>
                        <th>产出方式</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="saTableBody">
                    <tr><td colspan="8" class="qa-empty">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <common-pagination id="pagination"></common-pagination>
    </div>

    <!-- 关系提取弹窗 -->
    <div class="sa-modal-mask" id="saRelationModal">
        <div class="sa-modal">
            <div class="sa-modal-header">
                <span>血缘关系</span>
                <button class="sa-modal-close" data-close="saRelationModal">&times;</button>
            </div>
            <div class="sa-modal-body">
                <div class="sa-share-item"><b>上游来源</b></div>
                <table class="data-table" style="margin-bottom:14px;">
                    <thead><tr><th>上游数据集</th><th>上游版本</th><th>关系类型</th><th>主上游</th></tr></thead>
                    <tbody id="saUpstreamBody"></tbody>
                </table>
                <div class="sa-share-item"><b>下游派生</b></div>
                <table class="data-table">
                    <thead><tr><th>下游数据集</th><th>下游版本</th><th>关系类型</th><th>产出方式</th></tr></thead>
                    <tbody id="saDownstreamBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 影响分析弹窗 -->
    <div class="sa-modal-mask" id="saImpactModal">
        <div class="sa-modal">
            <div class="sa-modal-header">
                <span>影响范围分析</span>
                <button class="sa-modal-close" data-close="saImpactModal">&times;</button>
            </div>
            <div class="sa-modal-body">
                <div class="sa-summary" id="saImpactSummary"></div>
                <table class="data-table">
                    <thead><tr><th>数据集</th><th>版本</th><th>产出方式</th><th>级联深度</th><th>版本链路径</th><th>样本量</th></tr></thead>
                    <tbody id="saImpactBody"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>
