<div class="job-execution">
    <div class="db-table-card">
        <div class="detail-header">
            <div class="header-left">
                <button class="back-btn" id="backBtn">← 返回编排</button>
                <h2 class="job-title" id="jobTitle">作业执行监控</h2>
            </div>
            <div class="header-actions">
                <button class="toolbar-btn blue" id="refreshBtn">刷新状态</button>
            </div>
        </div>

        <div class="job-info-panel">
            <div class="info-row">
                <div class="info-item">
                    <label>作业ID：</label>
                    <span id="jobId">-</span>
                </div>
                <div class="info-item">
                    <label>作业名称：</label>
                    <span id="jobName">-</span>
                </div>
                <div class="info-item">
                    <label>当前状态：</label>
                    <span id="jobStatus" class="status-badge">-</span>
                </div>
            </div>
            <div class="info-row">
                <div class="info-item">
                    <label>开始时间：</label>
                    <span id="startTime">-</span>
                </div>
                <div class="info-item">
                    <label>结束时间：</label>
                    <span id="endTime">-</span>
                </div>
                <div class="info-item">
                    <label>运行时长：</label>
                    <span id="duration">-</span>
                </div>
            </div>
        </div>

        <div class="execution-tabs">
            <div class="tab-item active" data-tab="tasks">任务列表</div>
            <div class="tab-item" data-tab="logs">执行日志</div>
            <div class="tab-item" data-tab="results">执行结果</div>
        </div>

        <!-- 任务列表 -->
        <div class="tab-content active" id="tasksTab">
            <div class="tasks-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>任务ID</th>
                            <th>任务类型</th>
                            <th>数据集</th>
                            <th>Transform函数</th>
                            <th>状态</th>
                            <th>进度</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 执行日志 -->
        <div class="tab-content" id="logsTab">
            <div class="logs-container">
                <div class="log-toolbar">
                    <button class="toolbar-btn" id="clearLogsBtn">清空日志</button>
                    <button class="toolbar-btn" id="downloadLogsBtn">下载日志</button>
                </div>
                <div class="log-output" id="logOutput">
                    <div class="log-line">等待任务执行...</div>
                </div>
            </div>
        </div>

        <!-- 执行结果 -->
        <div class="tab-content" id="resultsTab">
            <div class="results-container">
                <div class="result-summary">
                    <div class="result-card">
                        <div class="result-label">处理记录数</div>
                        <div class="result-value" id="processedCount">0</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">输出记录数</div>
                        <div class="result-value" id="outputCount">0</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">错误记录数</div>
                        <div class="result-value error" id="errorCount">0</div>
                    </div>
                </div>
                <div class="result-output">
                    <h4>输出预览</h4>
                    <pre id="resultOutput" class="output-block">暂无输出数据</pre>
                </div>
            </div>
        </div>
    </div>
</div>
