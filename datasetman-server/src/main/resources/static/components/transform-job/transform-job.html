<div class="transform-job">
    <div class="filter-card">
        <div class="filter-header">筛选</div>
        <div class="filter-rows" id="filterRows">
            <div class="filter-row">
                <div class="filter-field">
                    <span class="filter-label">作业名称</span>
                    <input class="filter-input" type="text" placeholder="请输入作业名称" />
                </div>
                <div class="filter-field">
                    <span class="filter-label">状态</span>
                    <select class="filter-input">
                        <option value="">全部</option>
                        <option value="0">未知</option>
                        <option value="1">完成</option>
                        <option value="2">创建</option>
                        <option value="3">等待运行</option>
                        <option value="4">运行中</option>
                        <option value="5">部分失败中</option>
                        <option value="6">部分失败</option>
                        <option value="7">失败中</option>
                        <option value="8">失败</option>
                        <option value="9">取消中</option>
                        <option value="10">取消</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="filter-actions">
            <div class="filter-spacer"></div>
            <button class="filter-btn outline" type="button" id="resetFilters">重置</button>
            <button class="filter-btn solid" type="button" id="applyFilters">查询</button>
        </div>
    </div>

    <div class="table-card">
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>jobId</th>
                        <th>状态</th>
                        <th>名称</th>
                        <th>导出文件名</th>
                        <th>调度策略</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <common-pagination id="pagination"></common-pagination>
    </div>
</div>
