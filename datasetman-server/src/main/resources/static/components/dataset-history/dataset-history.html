<div class="dataset-history">
    <div class="db-table-card">
        <div class="detail-header">
            <div class="header-left">
                <button class="back-btn" id="backBtn">← 返回列表</button>
                <h2 class="dataset-title" id="datasetTitle">数据集详情</h2>
            </div>
            <div class="header-actions">
                <button class="toolbar-btn blue" id="refreshBtn">刷新</button>
            </div>
        </div>

        <div class="detail-tabs">
            <div class="tab-item active" data-tab="overview">概览</div>
            <div class="tab-item" data-tab="timeline">时间线</div>
            <div class="tab-item" data-tab="lineage">血缘图谱</div>
        </div>

        <!-- 概览标签页 -->
        <div class="tab-content active" id="overviewTab">
            <div class="info-section">
                <h4>基本信息</h4>
                <div class="info-grid">
                    <div class="info-item">
                        <label>数据集名称：</label>
                        <span id="datasetName">-</span>
                    </div>
                    <div class="info-item">
                        <label>创建时间：</label>
                        <span id="createTime">-</span>
                    </div>
                    <div class="info-item">
                        <label>更新时间：</label>
                        <span id="updateTime">-</span>
                    </div>
                    <div class="info-item full-width">
                        <label>SQL定义：</label>
                        <pre id="datasetSql" class="sql-block">-</pre>
                    </div>
                </div>
            </div>
        </div>

        <!-- 时间线标签页 -->
        <div class="tab-content" id="timelineTab">
            <div class="timeline-container">
                <div class="timeline" id="timelineList">
                    <!-- 时间线项目将通过JS动态生成 -->
                </div>
            </div>
        </div>

        <!-- 血缘图谱标签页 -->
        <div class="tab-content" id="lineageTab">
            <div class="lineage-container">
                <div id="lineageGraph" style="width: 100%; height: 400px;">
                    <!-- 血缘图谱将使用ECharts渲染 -->
                    <div class="graph-placeholder">血缘图谱加载中...</div>
                </div>
            </div>
        </div>
    </div>
</div>
