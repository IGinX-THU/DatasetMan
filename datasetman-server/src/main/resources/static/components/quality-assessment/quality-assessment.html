<div class="parsing-rules">
    <!-- 查询任务列表 -->
    <div id="qaListView" class="qa-view">

        <!-- 自动检测操作 -->
        <div class="parsing-filter-card">
            <div class="filter-header">自动质量检测（绑定数据集版本与评价准则，5维度得分与报告自动生成）</div>
            <div class="filter-rows">
                <div class="filter-row" style="display:grid;grid-template-columns:1.4fr 1.2fr 1.2fr 0.8fr;gap:12px;align-items:end;">
                    <div class="filter-field" style="min-width:0;">
                        <span class="filter-label">数据集</span>
                        <select class="filter-input" id="qaDatasetSelect" style="width:100%;">
                            <option value="">请选择数据集</option>
                        </select>
                    </div>
                    <div class="filter-field" style="min-width:0;">
                        <span class="filter-label">版本</span>
                        <select class="filter-input" id="qaVersionSelect" style="width:100%;" disabled>
                            <option value="">请先选择数据集</option>
                        </select>
                    </div>
                    <div class="filter-field" style="min-width:0;">
                        <span class="filter-label">评价准则</span>
                        <select class="filter-input" id="qaCriteriaSelect" style="width:100%;">
                            <option value="">默认权重（各20%）</option>
                        </select>
                    </div>
                    <div class="filter-field" style="min-width:0;">
                        <span class="filter-label">抽样行数</span>
                        <input class="filter-input" type="number" min="1" max="50000" value="50000" id="qaSampleSize" style="width:100%;">
                    </div>
                </div>
            </div>
            <div class="filter-actions">
                <div class="filter-spacer"></div>
                <button class="filter-btn solid" type="button" id="qaAutoDetect">自动检测并生成报告</button>
            </div>
        </div>

        <div class="parsing-table-card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>数据集</th>
                            <th>版本</th>
                            <th>评价准则</th>
                            <th rowspan="2">抽样行数</th>
                            <th rowspan="2">提交时间</th>
                            <th rowspan="2">完整性</th>
                            <th rowspan="2">一致性</th>
                            <th rowspan="2">时效性</th>
                            <th rowspan="2">有效性</th>
                            <th rowspan="2">DQI</th>
                            <th rowspan="2">操作</th>
                        </tr>
                        <tr class="qa-header-filter">
                            <th>
                                <input type="text" placeholder="筛选数据集" id="qaFilterDataset" qa-auto-filter
                                       style="width:100%;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;box-sizing:border-box;font-weight:normal;" />
                            </th>
                            <th>
                                <input type="text" placeholder="筛选版本" id="qaFilterVersion" qa-auto-filter
                                       style="width:100%;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;box-sizing:border-box;font-weight:normal;" />
                            </th>
                            <th>
                                <input type="text" placeholder="筛选准则名称" id="qaFilterName" qa-auto-filter
                                       style="width:100%;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;box-sizing:border-box;font-weight:normal;" />
                            </th>
                        </tr>
                    </thead>
                    <tbody id="qaTableBody">
                        <tr>
                            <td colspan="12" class="qa-empty">暂无测评记录，请在上方绑定数据集版本执行自动检测。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <common-pagination id="qaPagination"></common-pagination>
        </div>
    </div>

    <!-- 质量评估报告详情 -->
    <div id="qaDetailView" class="qa-view" style="display: none;">
            <input type="hidden" id="qaRecordId">
            <div class="qa-form-row">
                <label>数据集</label>
                <div id="qaDatasetName" class="qa-readonly-value">-</div>
            </div>
            <div class="qa-form-row">
                <label>版本</label>
                <div id="qaVersionNo" class="qa-readonly-value">-</div>
            </div>
            <div class="qa-form-row">
                <label>评价准则</label>
                <div id="qaCriteriaName" class="qa-readonly-value">-</div>
            </div>
            <div class="qa-summary" id="qaCriteriaDescription"></div>
            <div class="qa-summary" id="qaSampleInfo" style="margin-top:8px;"></div>

            <div class="qa-dqi-card" id="qaDqiCard" style="display: none;">
                <div>
                    <div class="qa-dqi-label">综合质量指数 DQI</div>
                    <div class="qa-dqi-value" id="qaDqiValue">-</div>
                </div>
                <div class="qa-status" id="qaStatus">-</div>
            </div>

            <div id="qaReportArea" style="margin-top:16px;"></div>
            <div class="qa-form-actions">
                <button type="button" class="qa-back-btn" id="qaBackBtn">返回列表</button>
                <button type="button" class="qa-query-btn" id="qaPrintReport" style="display:none;">打印/导出PDF</button>
            </div>
        </div>
</div>
