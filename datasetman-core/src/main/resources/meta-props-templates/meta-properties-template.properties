#
# 关系型数据源 元数据配置文件模板（全参数）
# 用途：注册 relational 数据源时的 meta_properties_path 参数
# 用法：按所接引擎启用对应取值（默认启用达梦），放到 IGinX 服务器上，注册时填写绝对路径
# 注意：不填写 meta_properties_path 时，IGinX 使用驱动目录下各引擎默认配置（如 dm-meta.properties）
#
# ★ 达梦注意事项（实测结论）：
#   1. 达梦JDBC的getTables/getColumns会忽略catalog参数，必须配合 schema_pattern 限定扫描范围，
#      否则每个模式都会注册出全库的"幻影表"，查询时报"无效的表或视图名"
#   2. getObject()返回类型与MySQL/PG不同：DECIMAL/NUMERIC/NUMBER/DEC→BigDecimal、FLOAT→Double、
#      TINYINT→Byte、SMALLINT→Short，这些类型映射为INTEGER/LONG/DOUBLE/FLOAT会强转异常，须映射BINARY；
#      业务表需要真数值列请用 INT/BIGINT/DOUBLE
#   3. CONCAT不支持BIT参数（含BIT列的表无法生成RELATIONAL+KEY），建表时用INT代替BIT、用VARCHAR代替TEXT/CLOB

# ==================== 驱动与基础配置 ====================

# 驱动类
# 达梦: dm.jdbc.driver.DmDriver
# MySQL: com.mysql.cj.jdbc.Driver
# PostgreSQL: org.postgresql.Driver
driver_class=dm.jdbc.driver.DmDriver

# 包裹表名和字段名的引号
# 达梦/PostgreSQL: "    MySQL: `(反引号)
quote="

# 默认数据库（扫描时会跳过该模式）
# 达梦: SYSDBA    MySQL: mysql    PostgreSQL: postgres
default_database=SYSDBA

# 系统库（系统模式），扫描时过滤；可追加不想接入的业务模式名，逗号分隔
# 达梦: SYS,SYSAUDITOR,SYSSSO,SYSSYNO,CTISYS
# MySQL: performance_schema,information_schema,mysql,sys
# PostgreSQL: template0,template1
system_databases=SYS,SYSAUDITOR,SYSSSO,SYSSYNO,CTISYS

# 获取数据库（模式）列表的SQL语句
# 达梦: SELECT DISTINCT OWNER AS datname FROM ALL_TABLES;
#       只接入指定模式时改为: SELECT DISTINCT OWNER AS datname FROM ALL_TABLES WHERE OWNER = '业务模式名';
# MySQL: SELECT SCHEMA_NAME AS datname FROM information_schema.schemata;
# PostgreSQL: SELECT datname FROM pg_database;
database_query_sql=SELECT DISTINCT OWNER AS datname FROM ALL_TABLES;

# 删除"数据库"的SQL语句
# 达梦(删除模式): DROP SCHEMA IF EXISTS %s CASCADE;
# MySQL: DROP DATABASE IF EXISTS %s;
# PostgreSQL: DROP DATABASE IF EXISTS %s WITH (FORCE);
drop_database_statement=DROP SCHEMA IF EXISTS %s CASCADE;

# 在JDBC使用getTables时是否需要加引号
# 达梦/PostgreSQL: false    MySQL: true
jdbc_need_quote=false

# upsert语句（达梦/MySQL相同；PostgreSQL见下方注释）
upsert_statement= ON DUPLICATE KEY UPDATE
upsert_conflict_statement= %s = VALUES(%s)
# PostgreSQL:
# upsert_statement= ON CONFLICT ("RELATIONAL+KEY") DO UPDATE SET
# upsert_conflict_statement= %s = EXCLUDED.%s

# 是否支持full join
# 达梦/PostgreSQL: true    MySQL: false
is_support_full_join=true

# filter中正则匹配/不匹配的符号
# 达梦: REGEXP / NOT REGEXP    MySQL: REGEXP / NOT REGEXP    PostgreSQL: ~ / !~
regex_like_symbol=REGEXP
not_regex_like_symbol=NOT REGEXP

# jdbc元数据获取是否支持特殊字符识别
jdbc_support_special_char=true

# ==================== 可选引擎差异项 ====================

# 限定表/列元数据扫描范围（达梦必配，见顶部注意事项1；PostgreSQL通常为public）
# schema_pattern=业务模式名

# ==================== 类型映射 ====================

# 引擎类型 -> IGinX类型
# 下面默认启用达梦的实测安全映射；MySQL参考: FLOAT=IGinX-FLOAT, DOUBLE=IGinX-DOUBLE, DECIMAL=IGinX-DOUBLE,
#   TINYINT=IGinX-BOOLEAN, SMALLINT/MEDIUMINT/INT/INTEGER=IGinX-INTEGER, BIGINT=IGinX-LONG
# PostgreSQL参考: BOOL=IGinX-BOOLEAN, INT/INT2/INT4/SERIAL2/SERIAL4=IGinX-INTEGER,
#   INT8/SERIAL8=IGinX-LONG, FLOAT4=IGinX-FLOAT, DECIMAL/FLOAT8=IGinX-DOUBLE
BIT=IGinX-BOOLEAN
TINYINT=IGinX-BINARY
SMALLINT=IGinX-BINARY
INT=IGinX-INTEGER
INTEGER=IGinX-INTEGER
BIGINT=IGinX-LONG
DEC=IGinX-BINARY
DECIMAL=IGinX-BINARY
NUMERIC=IGinX-BINARY
NUMBER=IGinX-BINARY
REAL=IGinX-FLOAT
FLOAT=IGinX-BINARY
DOUBLE=IGinX-DOUBLE

# IGinX类型 -> 引擎类型
# MySQL的差异项: IGinX-FLOAT=FLOAT(12,6)  IGinX-DOUBLE=DOUBLE(22,11)  IGinX-BOOLEAN=TINYINT
IGinX-INTEGER=INTEGER
IGinX-FLOAT=FLOAT
IGinX-DOUBLE=DOUBLE
IGinX-BOOLEAN=BIT
IGinX-BINARY=TEXT
IGinX-LONG=BIGINT
